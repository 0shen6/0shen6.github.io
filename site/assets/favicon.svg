<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Pixel flag</title>
  <rect width="16" height="16" rx="2" fill="#0b0f14"/>
  <!-- pole -->
  <rect x="4" y="2" width="2" height="12" fill="#d7e0ea"/>
  <!-- flag, stepped pixel edge -->
  <rect x="6" y="2" width="6" height="2" fill="#39d98a"/>
  <rect x="6" y="4" width="7" height="2" fill="#39d98a"/>
  <rect x="6" y="6" width="6" height="2" fill="#39d98a"/>
  <!-- base -->
  <rect x="2" y="13" width="6" height="1" fill="#8b9aab"/>
</svg>
